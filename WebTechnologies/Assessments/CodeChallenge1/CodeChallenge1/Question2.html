<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Odd or Even</title>
</head>
<body>

        <h2>Odd and Even Numbers from 0 to 15</h2>

        <script>for (var i = 0; i <= 15; i++) {

            if (i % 2 == 0) {
                document.write(i + " is even <br>");
            }
            else {
                document.write(i + " is odd <br>");
            }

        }</script>

    </body>
</html>
