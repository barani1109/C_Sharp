<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Show First List Item</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#btn").click(function () {

                var firstItem = $("li").first().text();

                $("#result").text(firstItem);

            });

        });
    </script>

</head>

<body>

    <ul>
        <li>CSHARP</li>
        <li>SQL</li>
        <li>ADO</li>
    </ul>

    <button id="btn">Show First Item</button>

    <p id="result"></p>

</body>
</html>
